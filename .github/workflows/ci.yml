name: CI

# Runs on every pull request to main, so a release PR gets a real check before
# it is merged. Read-only: one secret (JOYMIFY_PACKAGES_READ_TOKEN, which
# must be a classic token whose only scope is read:packages; given to the
# install step only, with --ignore-scripts), no id-token, no environment,
# no Pages.
# This is a separate file from release.yml on purpose; npm trusted publishing
# is bound to release.yml, so nothing here can publish.
#
# It runs scripts/precheck.sh (Gate 1): build + typecheck, unit tests, and the
# docs typecheck and tests. Same Node/pnpm setup as release.yml.
#
# precheck.sh runs the Dart/Flutter suites only when the tool is installed, and
# no setup step is added here, so on a stock ubuntu runner:
#   - Dart tests (packages/ucsa_dart) - skipped, no `dart` on the runner
#   - Flutter tests (packages/ucsa_flutter) - skipped, no `flutter`
# .NET tests (packages/com.ucsa.core, packages/com.ucsa.unity) DO run:
# ubuntu-latest ships `dotnet`. If the NuGet restore proves flaky on the
# runner, that is the first thing to look at.
# The Godot in-engine smoke test (packages/ucsa_godot) DOES run: one step
# below downloads a pinned Godot .NET build, checks its SHA-512, and sets
# UCSA_REQUIRE_GODOT_SMOKE=1 so precheck.sh fails instead of skipping.
# Run the Dart/Flutter suites locally via `bash scripts/precheck.sh`.
# Gate 2 (scripts/integration.sh) is not run here.
on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  precheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # The private @montionugera/joy-* packages live on GitHub Packages
      # (account montionugera, repository joy-design). Only the token line goes
      # here; the scope mapping is in pnpm-workspace.yaml and must never be
      # written to an npm config file (it would redirect the library release).
      # The line keeps its ${...} placeholder, so the token itself is never
      # written to disk; only the install step has the variable.
      # The leading newline matters: actions/setup-node writes its config file
      # without a final newline, so a bare append would join its last line.
      - name: Point npm at the Joymify package token
        run: |
          printf '\n%s\n' '//npm.pkg.github.com/:_authToken=${JOYMIFY_PACKAGES_READ_TOKEN}' >> "${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"

      - name: Install dependencies
        run: |
          if [ -z "$JOYMIFY_PACKAGES_READ_TOKEN" ]; then
            echo "::error::JOYMIFY_PACKAGES_READ_TOKEN is empty: the secret is missing, or this run gets no secrets (a pull request from a fork or from Dependabot). The private @montionugera/joy-* packages cannot be installed."
            exit 1
          fi
          pnpm install --frozen-lockfile --ignore-scripts
        env:
          JOYMIFY_PACKAGES_READ_TOKEN: ${{ secrets.JOYMIFY_PACKAGES_READ_TOKEN }}

      # Dependency build scripts (better-sqlite3, esbuild) run here, in a step
      # whose environment has no token. No workspace prepare/postinstall exists.
      - name: Build native dependencies (no token)
        run: pnpm rebuild

      # Godot .NET, pinned, for the in-engine smoke test of packages/ucsa_godot.
      # The archive is checked against the SHA-512 from the release's
      # SHA512-SUMS.txt before it is unpacked. No secret is in scope here.
      - name: Install Godot .NET (pinned)
        env:
          GODOT_VERSION: 4.7.2-stable
          GODOT_SHA512: 1855960b27ee3ef5e66e5e228cced69d55637b24334a7411162687dcd077d8f9f645348cdb8eae984bec8135d49ed855a1e3a16476786b8bce60774fd8402d13
        run: |
          set -euo pipefail
          name="Godot_v${GODOT_VERSION}_mono_linux_x86_64"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/godot.zip" "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/${name}.zip"
          echo "${GODOT_SHA512}  $RUNNER_TEMP/godot.zip" | sha512sum -c -
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          bin="$RUNNER_TEMP/godot/${name}/Godot_v${GODOT_VERSION}_mono_linux.x86_64"
          test -x "$bin"
          "$bin" --version
          echo "GODOT_MONO_BIN=$bin" >> "$GITHUB_ENV"

      - name: Gate 1 (precheck)
        env:
          UCSA_REQUIRE_GODOT_SMOKE: "1"
        run: bash scripts/precheck.sh
