# Deploys the UCSA docs portal (apps/docs) to GitHub Pages.
# The portal is built with base path /cli-state-handler/ (see apps/docs/vite.config.ts),
# so it must be served from https://<owner>.github.io/cli-state-handler/.
# Requires: repo Settings > Pages > Source = "GitHub Actions".
name: docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @montionugera/ucsa-core build
      - name: Test apps/docs
        run: pnpm --filter @ucsa/docs test
      - name: Build apps/docs
        run: pnpm --filter @ucsa/docs build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/docs/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
